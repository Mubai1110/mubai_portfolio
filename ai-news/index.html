<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 每日情报库 | Mubai Xiao</title>
  <meta name="description" content="Mubai Xiao's curated AI industry intelligence knowledge base.">
  <link rel="icon" href="../avatar.jpg">
  <link rel="stylesheet" href="styles.css?v=20260704-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <a class="brand-mark" href="../" aria-label="Back to home">MX</a>
        <div>
          <h1>AI 每日情报库</h1>
          <p>我的 AI 赛道情报库</p>
        </div>
      </div>

      <a class="home-link" href="../">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>

      <section class="control-group">
        <label for="searchInput">搜索</label>
        <input id="searchInput" type="search" placeholder="公司、人物、产品、技术、关键词">
      </section>

      <section class="control-group">
        <label for="dateSelect">日期</label>
        <select id="dateSelect"></select>
      </section>

      <section class="control-group">
        <label for="categorySelect">分类</label>
        <select id="categorySelect"></select>
      </section>

      <section class="control-group">
        <label>快速筛选</label>
        <div id="tagList" class="tag-list"></div>
      </section>
    </aside>

    <section class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Knowledge Base</p>
          <h2 id="pageTitle">AI 每日情报库</h2>
          <p class="page-subtitle">追踪产品、Infra、模型训练、融资、关键人物、开源生态与前沿应用的 AI 产业情报库。</p>
        </div>
        <div class="topbar-actions">
          <a class="back-home-button" href="../">
            <i class="fas fa-arrow-left"></i>
            <span>返回主页</span>
          </a>
          <div class="stats">
            <div><strong id="digestCount">0</strong><span>日报</span></div>
            <div><strong id="articleCount">0</strong><span>文章</span></div>
            <div><strong id="visibleCount">0</strong><span>当前显示</span></div>
          </div>
        </div>
      </header>

      <div id="activeFilters" class="active-filters"></div>
      <div id="articleList" class="article-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        没有找到匹配的新闻。
      </div>
    </section>
  </main>

  <script src="news-data.js?v=20260704-1"></script>
  <script src="app.js?v=20260704-1"></script>
</body>
</html>
